<!DOCTYPE html>
<html lang="en">
<head>
    <title>Latihan 1 HTML</title>
    <style>
        table {
            border-collapse: collapse;
        }
        td {
            padding: 6px 8px;
            vertical-align: top;
        }
        label {
            font-weight: normal;
        }
        input[type="text"],
        input[type="password"] {
            width: 220px;
            padding: 3px 5px;
        }
        select {
            width: 232px;
            padding: 3px;
        }
        textarea {
            width: 320px;
            height: 130px;
            padding: 5px;
            resize: both;
        }
        input[type="submit"] {
            padding: 5px 18px;
        }
    </style>
</head>
<body>
    <form action="#" method="post">
        <table>
            <tr>
                <td><label for="nama">Nama</label></td>
                <td><input type="text" id="nama" name="nama" value="Romi"></td>
            </tr>
            <tr>
                <td><label for="email">Email</label></td>
                <td><input type="text" id="email" name="email" value="romi@gmail.com"></td>
            </tr>
            <tr>
                <td><label for="username">Username</label></td>
                <td><input type="text" id="username" name="username" value="romi"></td>
            </tr>
            <tr>
                <td><label for="password">Password</label></td>
                <td><input type="password" id="password" name="password" value="romi"></td>
            </tr>
            <tr>
                <td><label for="jenisKelamin">Jenis Kelamin</label></td>
                <td>
                    <select id="jenisKelamin" name="jenisKelamin">
                        <option value="Laki-Laki">Laki-Laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="alamat">Alamat</label></td>
                <td><textarea id="alamat" name="alamat">Bogor</textarea></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="Simpan"></td>
            </tr>
        </table>
    </form>
</body>
</html>
